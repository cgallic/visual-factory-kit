<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_portrait %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(54*s)|round|int}}px;background:#f0ece4}.canvas::before,.canvas::after{display:none}.card{height:100%;overflow:hidden;border-radius:{{(26*s)|round|int}}px;background:#fff;box-shadow:0 {{(18*s)|round|int}}px {{(42*s)|round|int}}px rgba(72,56,34,.16)}.head{padding:{{(32*s)|round|int}}px {{(37*s)|round|int}}px;color:#372e24;font:800 {{(16*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.halves{height:73%;display:grid;grid-template-rows:1fr 1fr}.half{padding:{{(34*s)|round|int}}px {{(37*s)|round|int}}px}.before{background:#f6dfdc;color:#743a38}.after{background:#d9efe6;color:#205f48}.label{font:800 {{(15*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.copy{margin-top:{{(19*s)|round|int}}px;font:900 {{(38*s)|round|int}}px/.99 var(--kai-font-display);max-height:{{(185*s)|round|int}}px}.proof{margin-top:{{(16*s)|round|int}}px;font:800 {{(16*s)|round|int}}px/1.2 var(--kai-font-body)}.footer{padding:{{(24*s)|round|int}}px {{(37*s)|round|int}}px;color:#625449;font:700 {{(16*s)|round|int}}px var(--kai-font-body)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="card"><div class="head">{{brand_name}} · {{d.get('series','Before / after')}}</div><div class="halves"><section class="half before"><div class="label">Before</div><div class="copy" data-fit="interface-headline" data-min-font-size="{{(20*s)|round|int}}">{{d.get('before',headline)}}</div></section><section class="half after"><div class="label">After</div><div class="copy">{{d.get('after',subhead or 'The next action is clear and timely.') }}</div><div class="proof" data-fit="interface-proof" data-min-font-size="{{(11*s)|round|int}}">{{proof_label}}</div></section></div><div class="footer">{{d.get('footer','Small design changes can create a much clearer system.') }}</div></section></main></body></html>
