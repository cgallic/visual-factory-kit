<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_square %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(56*s)|round|int}}px;background:#dfe9f6}.canvas::before,.canvas::after{display:none}.window{height:100%;overflow:hidden;border-radius:{{(28*s)|round|int}}px;background:#fff;box-shadow:0 {{(24*s)|round|int}}px {{(58*s)|round|int}}px rgba(20,35,55,.20)}.tabs{display:flex;align-items:center;gap:{{(10*s)|round|int}}px;padding:{{(20*s)|round|int}}px;background:#eef3f8}.dot{width:{{(13*s)|round|int}}px;height:{{(13*s)|round|int}}px;border-radius:50%;background:#fb7b6b}.dot:nth-child(2){background:#f7c95e}.dot:nth-child(3){background:#6ac58a}.tab{margin-left:{{(12*s)|round|int}}px;padding:{{(9*s)|round|int}}px {{(17*s)|round|int}}px;border-radius:{{(10*s)|round|int}}px;background:#fff;color:#5a697a;font:700 {{(15*s)|round|int}}px var(--kai-font-body)}.address{margin:{{(25*s)|round|int}}px;padding:{{(16*s)|round|int}}px {{(20*s)|round|int}}px;border:1px solid #dce4ed;border-radius:{{(14*s)|round|int}}px;color:#607083;font:700 {{(16*s)|round|int}}px var(--kai-font-mono)}.content{padding:{{(26*s)|round|int}}px {{(47*s)|round|int}}px}.eyebrow{color:var(--kai-brand-blue);font:800 {{(16*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.title{margin:{{(22*s)|round|int}}px 0;color:#172033;font:900 {{(52*s)|round|int}}px/.98 var(--kai-font-display);max-height:{{(320*s)|round|int}}px}.proof{margin-top:{{(35*s)|round|int}}px;padding:{{(19*s)|round|int}}px;border-left:{{(6*s)|round|int}}px solid #1f8ddb;background:#eef8ff;color:#1d4a70;font:800 {{(20*s)|round|int}}px/1.2 var(--kai-font-body)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><article class="window"><div class="tabs"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="tab">{{d.get('tab_label',brand_name ~ ' guide')}}</span></div><div class="address">⌕ {{d.get('url','yourbrand.com/next-step')}}</div><section class="content"><div class="eyebrow">{{d.get('eyebrow','What customers are looking for')}}</div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(26*s)|round|int}}">{{headline}}</h1><div class="proof" data-fit="interface-proof" data-min-font-size="{{(13*s)|round|int}}">{{proof_label or subhead}}</div></section></article></main></body></html>
