<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_landscape %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(42*s)|round|int}}px;background:linear-gradient(135deg,#d9e9ef,#bfd3e7)}.canvas::before,.canvas::after{display:none}.window{height:100%;overflow:hidden;border-radius:{{(26*s)|round|int}}px;background:#fff;box-shadow:0 {{(23*s)|round|int}}px {{(55*s)|round|int}}px rgba(16,36,60,.18)}.bar{display:flex;align-items:center;gap:{{(10*s)|round|int}}px;padding:{{(18*s)|round|int}}px {{(25*s)|round|int}}px;background:#eef3f6}.dot{width:{{(13*s)|round|int}}px;height:{{(13*s)|round|int}}px;border-radius:50%;background:#ed7767}.dot:nth-child(2){background:#f3c65b}.dot:nth-child(3){background:#66bb84}.url{margin-left:{{(20*s)|round|int}}px;padding:{{(9*s)|round|int}}px {{(20*s)|round|int}}px;flex:1;border-radius:{{(12*s)|round|int}}px;background:white;color:#657386;font:700 {{(14*s)|round|int}}px var(--kai-font-mono)}.content{display:grid;grid-template-columns:1.1fr .9fr;height:calc(100% - {{(66*s)|round|int}}px)}.copy{padding:{{(65*s)|round|int}}px}.tag{color:#1b77ae;font:800 {{(16*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.title{margin:{{(21*s)|round|int}}px 0;color:#18263b;font:900 {{(63*s)|round|int}}px/.96 var(--kai-font-display);max-height:{{(210*s)|round|int}}px}.proof{margin-top:{{(28*s)|round|int}}px;color:#42617e;font:700 {{(23*s)|round|int}}px/1.2 var(--kai-font-body)}.visual{display:grid;place-items:center;margin:{{(50*s)|round|int}}px;background:linear-gradient(135deg,#1c557c,#162c55);border-radius:{{(25*s)|round|int}}px;color:#d5f5ff;font:900 {{(38*s)|round|int}}px var(--kai-font-display);text-align:center;padding:{{(30*s)|round|int}}px}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><article class="window"><header class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><div class="url">{{d.get('url','yourbrand.com/release-notes')}}</div></header><div class="content"><section class="copy"><div class="tag">{{d.get('eyebrow','Product window')}}</div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(28*s)|round|int}}">{{headline}}</h1><p class="proof" data-fit="interface-proof" data-min-font-size="{{(13*s)|round|int}}">{{proof_label or subhead}}</p></section><aside class="visual">{{d.get('visual_label','A clearer\nnext step')}}</aside></div></article></main></body></html>
