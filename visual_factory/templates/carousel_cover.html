<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_portrait %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(55*s)|round|int}}px;background:linear-gradient(145deg,#f6f0e2,#e4d0a7)}.canvas::before,.canvas::after{display:none}.cover{height:100%;padding:{{(44*s)|round|int}}px;border-radius:{{(25*s)|round|int}}px;background:#252b38;color:#fdf7ea;box-shadow:0 {{(19*s)|round|int}}px {{(43*s)|round|int}}px rgba(72,50,17,.20)}.top{display:flex;align-items:center;justify-content:space-between;color:#f4cf78;font:800 {{(15*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.top img{width:{{(29*s)|round|int}}px;height:{{(29*s)|round|int}}px;object-fit:contain}.n{margin-top:{{(90*s)|round|int}}px;color:#f4cf78;font:900 {{(87*s)|round|int}}px/.8 var(--kai-font-display)}.title{margin-top:{{(38*s)|round|int}}px;font:900 {{(58*s)|round|int}}px/.96 var(--kai-font-display);max-height:{{(300*s)|round|int}}px}.hint{margin-top:{{(66*s)|round|int}}px;color:#dbe6eb;font:800 {{(18*s)|round|int}}px var(--kai-font-body)}.proof{margin-top:{{(19*s)|round|int}}px;color:#9bd9cf;font:800 {{(14*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="cover"><div class="top"><span>{{brand_name}}</span><img src="{{brand_icon_uri}}" alt=""></div><div class="n">{{d.get('slide_count','01 / 06')}}</div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(28*s)|round|int}}">{{headline}}</h1><div class="hint">{{d.get('hint','Swipe for the useful steps →')}}</div><div class="proof" data-fit="interface-proof" data-min-font-size="{{(11*s)|round|int}}">{{proof_label or subhead}}</div></section></main></body></html>
