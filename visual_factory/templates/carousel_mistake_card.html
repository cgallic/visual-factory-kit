<!doctype html><html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s = scale_portrait %}
{% set d = template_data %}
{% set deck = d.get('slides', []) %}
{% set index = format_spec.get('slide_index', 1)|int - 1 %}
{% set item = deck[index] if deck|length > index else {} %}
:root { --canvas-width: {{ width }}px; --canvas-height: {{ height }}px; }
.canvas::before, .canvas::after { display:none; }
.brand { display:flex; align-items:center; gap:{{ (10*s)|round|int }}px; font:800 {{ (16*s)|round|int }}px var(--kai-font-body); }
.brand img { width:{{ (28*s)|round|int }}px; height:{{ (28*s)|round|int }}px; object-fit:contain; }
.slide-no { font:800 {{ (16*s)|round|int }}px var(--kai-font-mono); letter-spacing:.05em; }
.micro { font:800 {{ (14*s)|round|int }}px var(--kai-font-mono); text-transform:uppercase; letter-spacing:.06em; }

.canvas{padding:{{(48*s)|round|int}}px;background:#f2e6e2;color:#352722}.card{height:100%;padding:{{(46*s)|round|int}}px;border-radius:{{(30*s)|round|int}}px;background:#fffaf7;box-shadow:0 {{(18*s)|round|int}}px {{(41*s)|round|int}}px rgba(101,54,37,.15)}.top{display:flex;justify-content:space-between;color:#8a6758}.number{margin-top:{{(98*s)|round|int}}px;color:#d45041;font:900 {{(181*s)|round|int}}px/.75 var(--kai-font-display);letter-spacing:-.08em}.label{margin-top:{{(22*s)|round|int}}px;color:#d45041;font:900 {{(18*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.title{margin:{{(26*s)|round|int}}px 0;color:#372b28;font:900 {{(55*s)|round|int}}px/.96 var(--kai-font-display);max-height:{{(295*s)|round|int}}px}.fix{margin-top:{{(30*s)|round|int}}px;padding:{{(19*s)|round|int}}px;border-radius:{{(16*s)|round|int}}px;background:#edf6ee;color:#276048;font:800 {{(22*s)|round|int}}px/1.22 var(--kai-font-body)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="card"><div class="top"><div class="brand"><img src="{{brand_icon_uri}}" alt=""><span>{{brand_name}}</span></div><span class="slide-no">{{'%02d'|format(index+1)}} / {{deck|length or 7}}</span></div><div class="number">{{item.get('number','01')}}</div><div class="label">Common mistake</div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(25*s)|round|int}}">{{item.get('headline',headline)}}</h1><div class="fix" data-fit="interface-proof" data-min-font-size="{{(13*s)|round|int}}">✓ {{item.get('support',subhead)}}</div></section></main></body></html>
