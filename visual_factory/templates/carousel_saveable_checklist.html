<!doctype html><html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s = scale_portrait %}
{% set d = template_data %}
{% set deck = d.get('slides', []) %}
{% set index = format_spec.get('slide_index', 1)|int - 1 %}
{% set item = deck[index] if deck|length > index else {} %}
:root { --canvas-width: {{ width }}px; --canvas-height: {{ height }}px; }
.canvas::before, .canvas::after { display:none; }
.brand { display:flex; align-items:center; gap:{{ (10*s)|round|int }}px; font:800 {{ (16*s)|round|int }}px var(--kai-font-body); }
.brand img { width:{{ (28*s)|round|int }}px; height:{{ (28*s)|round|int }}px; object-fit:contain; }
.slide-no { font:800 {{ (16*s)|round|int }}px var(--kai-font-mono); letter-spacing:.05em; }
.micro { font:800 {{ (14*s)|round|int }}px var(--kai-font-mono); text-transform:uppercase; letter-spacing:.06em; }

.canvas{padding:{{(48*s)|round|int}}px;background:#f4f2ec;color:#303b35}.card{height:100%;padding:{{(45*s)|round|int}}px;border-radius:{{(28*s)|round|int}}px;background:#fff;box-shadow:0 {{(18*s)|round|int}}px {{(40*s)|round|int}}px rgba(45,56,48,.12)}.top{display:flex;justify-content:space-between;color:#68776e}.title{margin:{{(53*s)|round|int}}px 0 {{(42*s)|round|int}}px;color:#1f342b;font:900 {{(59*s)|round|int}}px/.96 var(--kai-font-display);max-height:{{(260*s)|round|int}}px}.item{display:flex;gap:{{(18*s)|round|int}}px;align-items:flex-start;margin:{{(26*s)|round|int}}px 0;color:#32493d;font:800 {{(26*s)|round|int}}px/1.2 var(--kai-font-body)}.tick{display:grid;place-items:center;flex:0 0 auto;width:{{(34*s)|round|int}}px;height:{{(34*s)|round|int}}px;border-radius:{{(8*s)|round|int}}px;background:#4d9a7a;color:white;font:900 {{(21*s)|round|int}}px var(--kai-font-body)}.footer{position:absolute;left:{{(93*s)|round|int}}px;right:{{(93*s)|round|int}}px;bottom:{{(92*s)|round|int}}px;padding:{{(16*s)|round|int}}px;border-radius:{{(13*s)|round|int}}px;background:#e9f5ee;color:#28654d;font:900 {{(15*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="card"><div class="top"><div class="brand"><img src="{{brand_icon_uri}}" alt=""><span>{{brand_name}}</span></div><span class="slide-no">{{'%02d'|format(index+1)}} / {{deck|length or 7}}</span></div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(27*s)|round|int}}">{{item.get('headline',headline)}}</h1>{% for check in item.get('checks',['Capture what changed','Name the next action','Share the useful brief']) %}<div class="item"><span class="tick">✓</span><span>{{check}}</span></div>{% endfor %}<div class="footer" data-fit="interface-proof" data-min-font-size="{{(11*s)|round|int}}">{{item.get('proof','SAVE THIS CHECKLIST')}}</div></section></main></body></html>
