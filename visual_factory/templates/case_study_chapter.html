<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_portrait %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(60*s)|round|int}}px;background:linear-gradient(160deg,#343052,#775d92)}.canvas::before,.canvas::after{display:none}.chapter{height:100%;padding:{{(46*s)|round|int}}px;border:1px solid rgba(255,255,255,.26);border-radius:{{(22*s)|round|int}}px;background:rgba(17,15,35,.37);color:#f7f1ff}.chapter-no{color:#f6cf7a;font:800 {{(17*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.title{margin:{{(45*s)|round|int}}px 0;color:white;font:900 {{(59*s)|round|int}}px/.96 var(--kai-font-display);max-height:{{(315*s)|round|int}}px}.result{margin-top:{{(40*s)|round|int}}px;padding:{{(29*s)|round|int}}px;border-radius:{{(18*s)|round|int}}px;background:#f6cf7a;color:#342953}.result b{display:block;font:900 {{(43*s)|round|int}}px/.95 var(--kai-font-display)}.result span{display:block;margin-top:{{(9*s)|round|int}}px;font:700 {{(18*s)|round|int}}px/1.18 var(--kai-font-body)}.detail{margin-top:{{(30*s)|round|int}}px;color:#ded4f2;font:700 {{(20*s)|round|int}}px/1.28 var(--kai-font-body)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><article class="chapter"><div class="chapter-no">{{d.get('chapter_label','Case study · chapter 01')}}</div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(28*s)|round|int}}">{{headline}}</h1><div class="result"><b>{{d.get('result_value',proof_label or '64%') }}</b><span>{{d.get('result_label',subhead or 'A useful outcome, source-backed and clearly stated.') }}</span></div><p class="detail" data-fit="interface-proof" data-min-font-size="{{(13*s)|round|int}}">{{d.get('detail','From a messy handoff to a clear shared brief.') }}</p></article></main></body></html>
