<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_portrait %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(55*s)|round|int}}px;background:radial-gradient(circle at 82% 12%,#ffcf77,transparent 26%),#402c5f}.canvas::before,.canvas::after{display:none}.poster{height:100%;padding:{{(47*s)|round|int}}px;border:1px solid rgba(255,255,255,.34);border-radius:{{(28*s)|round|int}}px;color:#fff8e8;background:rgba(38,22,62,.42)}.brand{display:flex;align-items:center;gap:{{(10*s)|round|int}}px;color:#e4d8f5;font:800 {{(17*s)|round|int}}px var(--kai-font-body)}.brand img{width:{{(31*s)|round|int}}px;height:{{(31*s)|round|int}}px;object-fit:contain}.days{margin:{{(105*s)|round|int}}px 0 {{(25*s)|round|int}}px;color:#ffd379;font:900 {{(184*s)|round|int}}px/.78 var(--kai-font-display);letter-spacing:-.08em}.unit{color:#dcc8f8;font:800 {{(22*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.title{margin-top:{{(42*s)|round|int}}px;font:900 {{(48*s)|round|int}}px/.98 var(--kai-font-display);max-height:{{(240*s)|round|int}}px}.proof{margin-top:{{(32*s)|round|int}}px;color:#e4d8f5;font:800 {{(18*s)|round|int}}px/1.2 var(--kai-font-body)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="poster"><div class="brand"><img src="{{brand_icon_uri}}" alt=""><span>{{brand_name}}</span></div><div class="days">{{d.get('days','07')}}</div><div class="unit">{{d.get('unit','days to go')}}</div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(23*s)|round|int}}">{{headline}}</h1><div class="proof" data-fit="interface-proof" data-min-font-size="{{(12*s)|round|int}}">{{proof_label or subhead}}</div></section></main></body></html>
