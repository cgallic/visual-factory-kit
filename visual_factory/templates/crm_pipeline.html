<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_landscape %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(46*s)|round|int}}px;background:linear-gradient(130deg,#10263b,#274c65)}.canvas::before,.canvas::after{display:none}.panel{height:100%;padding:{{(44*s)|round|int}}px;border:1px solid rgba(255,255,255,.16);border-radius:{{(26*s)|round|int}}px;background:rgba(10,23,38,.6);color:#eff8ff}.tag{color:#8fe7cc;font:800 {{(16*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.title{max-width:{{(760*s)|round|int}}px;margin:{{(20*s)|round|int}}px 0 {{(44*s)|round|int}}px;font:900 {{(58*s)|round|int}}px/.96 var(--kai-font-display);max-height:{{(160*s)|round|int}}px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:{{(17*s)|round|int}}px}.step{position:relative;min-height:{{(170*s)|round|int}}px;padding:{{(23*s)|round|int}}px;border-radius:{{(18*s)|round|int}}px;background:rgba(255,255,255,.09)}.step:not(:last-child):after{content:'→';position:absolute;right:-{{(21*s)|round|int}}px;top:42%;color:#8fe7cc;font:900 {{(29*s)|round|int}}px var(--kai-font-body)}.num{color:#8fe7cc;font:800 {{(17*s)|round|int}}px var(--kai-font-mono)}.label{margin-top:{{(24*s)|round|int}}px;font:800 {{(27*s)|round|int}}px/1.05 var(--kai-font-body)}.proof{margin-top:{{(30*s)|round|int}}px;color:#c4dcf0;font:700 {{(21*s)|round|int}}px var(--kai-font-body)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="panel"><div class="tag">{{d.get('eyebrow','Pipeline view')}}</div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(26*s)|round|int}}">{{headline}}</h1><div class="flow">{% for step in d.get('steps',['Signal arrives','Context captured','Next step chosen','Owner briefed']) %}<div class="step"><div class="num">0{{loop.index}}</div><div class="label">{{step}}</div></div>{% endfor %}</div><div class="proof" data-fit="interface-proof" data-min-font-size="{{(13*s)|round|int}}">{{proof_label or subhead}}</div></section></main></body></html>
