<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_square %}{% set d=template_data %}{% set bars=d.get('bars',[34,53,71,92]) %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(59*s)|round|int}}px;background:#f1f4fb}.canvas::before,.canvas::after{display:none}.chart{height:100%;padding:{{(42*s)|round|int}}px;border-radius:{{(25*s)|round|int}}px;background:#fff;box-shadow:0 {{(17*s)|round|int}}px {{(40*s)|round|int}}px rgba(30,53,89,.14)}.top{display:flex;align-items:center;gap:{{(10*s)|round|int}}px;color:#51637c;font:800 {{(15*s)|round|int}}px var(--kai-font-mono)}.top img{width:{{(28*s)|round|int}}px;height:{{(28*s)|round|int}}px;object-fit:contain}.title{margin:{{(28*s)|round|int}}px 0;color:#202c3d;font:900 {{(46*s)|round|int}}px/.98 var(--kai-font-display);max-height:{{(190*s)|round|int}}px}.graph{display:flex;align-items:flex-end;gap:{{(20*s)|round|int}}px;height:{{(365*s)|round|int}}px;padding:{{(23*s)|round|int}}px;border-bottom:{{(3*s)|round|int}}px solid #cbd6e8;background:repeating-linear-gradient(0deg,transparent,transparent {{(67*s)|round|int}}px,#e7edf7 {{(68*s)|round|int}}px)}.bar{flex:1;min-height:{{(50*s)|round|int}}px;border-radius:{{(12*s)|round|int}}px {{(12*s)|round|int}}px 0 0;background:linear-gradient(#6ea8e7,#285c9d)}.bar:nth-child(2){background:linear-gradient(#8ac7b1,#2d896e)}.bar:nth-child(3){background:linear-gradient(#f0bb76,#c56a32)}.bar:nth-child(4){background:linear-gradient(#c09be8,#724aa5)}.proof{margin-top:{{(25*s)|round|int}}px;color:#40628b;font:800 {{(15*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="chart"><div class="top"><img src="{{brand_icon_uri}}" alt=""><span>{{d.get('chart_label','Proof snapshot')}}</span></div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(22*s)|round|int}}">{{headline}}</h1><div class="graph">{% for bar in bars %}<div class="bar" style="height:{{bar}}%"></div>{% endfor %}</div><div class="proof" data-fit="interface-proof" data-min-font-size="{{(11*s)|round|int}}">{{proof_label or subhead}}</div></section></main></body></html>
