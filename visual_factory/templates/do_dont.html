<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_square %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(53*s)|round|int}}px;background:#ecefea}.canvas::before,.canvas::after{display:none}.card{height:100%;overflow:hidden;border-radius:{{(26*s)|round|int}}px;background:#fff;box-shadow:0 {{(18*s)|round|int}}px {{(40*s)|round|int}}px rgba(39,56,45,.14)}.head{padding:{{(30*s)|round|int}}px;color:#3a4b3d;font:800 {{(15*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.title{margin:0 {{(31*s)|round|int}}px {{(28*s)|round|int}}px;color:#1f2e24;font:900 {{(45*s)|round|int}}px/.98 var(--kai-font-display);max-height:{{(180*s)|round|int}}px}.halves{display:grid;grid-template-columns:1fr 1fr;height:50%}.half{padding:{{(25*s)|round|int}}px}.dont{background:#f9e3e2;color:#8a3c3c}.do{background:#dbf1e6;color:#17634a}.symbol{font:900 {{(44*s)|round|int}}px var(--kai-font-display)}.label{margin-top:{{(11*s)|round|int}}px;font:800 {{(15*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.detail{margin-top:{{(22*s)|round|int}}px;font:800 {{(22*s)|round|int}}px/1.15 var(--kai-font-body)}.proof{margin:{{(23*s)|round|int}}px {{(31*s)|round|int}}px;color:#51695a;font:800 {{(14*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="card"><div class="head">{{brand_name}} · {{d.get('label','Operator rules')}}</div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(21*s)|round|int}}">{{headline}}</h1><div class="halves"><section class="half dont"><div class="symbol">×</div><div class="label">Don't</div><div class="detail">{{d.get('dont','Make the reader work to understand the next step.') }}</div></section><section class="half do"><div class="symbol">✓</div><div class="label">Do</div><div class="detail">{{d.get('do',subhead or 'Make the useful action unmistakably clear.') }}</div></section></div><div class="proof" data-fit="interface-proof" data-min-font-size="{{(10*s)|round|int}}">{{proof_label}}</div></section></main></body></html>
