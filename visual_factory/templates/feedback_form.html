<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_square %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(62*s)|round|int}}px;background:#dcefe8}.canvas::before,.canvas::after{display:none}.form{height:100%;padding:{{(45*s)|round|int}}px;border-radius:{{(28*s)|round|int}}px;background:#fff;color:#173629;box-shadow:0 {{(19*s)|round|int}}px {{(44*s)|round|int}}px rgba(24,78,57,.16)}.brand{display:flex;align-items:center;gap:{{(10*s)|round|int}}px;font:800 {{(17*s)|round|int}}px var(--kai-font-body)}.brand img{width:{{(29*s)|round|int}}px;height:{{(29*s)|round|int}}px;object-fit:contain}.title{margin:{{(38*s)|round|int}}px 0;font:900 {{(49*s)|round|int}}px/.98 var(--kai-font-display);max-height:{{(260*s)|round|int}}px}.faces{display:flex;justify-content:space-between;margin:{{(25*s)|round|int}}px 0}.face{display:grid;place-items:center;width:{{(79*s)|round|int}}px;height:{{(79*s)|round|int}}px;border:{{(2*s)|round|int}}px solid #d6e5de;border-radius:50%;color:#71877b;font:900 {{(31*s)|round|int}}px var(--kai-font-body)}.face.active{color:#fff;border-color:#287958;background:#287958}.response{margin-top:{{(34*s)|round|int}}px;padding:{{(21*s)|round|int}}px;border-radius:{{(14*s)|round|int}}px;background:#edf8f2;color:#22533e;font:700 {{(20*s)|round|int}}px/1.25 var(--kai-font-body)}.proof{margin-top:{{(27*s)|round|int}}px;color:#396550;font:800 {{(17*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><article class="form"><div class="brand"><img src="{{brand_icon_uri}}" alt=""><span>{{brand_name}}</span></div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(25*s)|round|int}}">{{headline}}</h1><div class="faces"><span class="face">☹</span><span class="face">◔</span><span class="face active">●</span><span class="face">☺</span></div><div class="response">{{d.get('response',subhead or 'The useful answer is the one that makes the next step easy.') }}</div><div class="proof" data-fit="interface-proof" data-min-font-size="{{(12*s)|round|int}}">{{proof_label}}</div></article></main></body></html>
