<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_landscape %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(44*s)|round|int}}px;background:#f4f0e8}.canvas::before,.canvas::after{display:none}.model{height:100%;padding:{{(42*s)|round|int}}px;border-radius:{{(24*s)|round|int}}px;background:#fffdf8;box-shadow:0 {{(18*s)|round|int}}px {{(40*s)|round|int}}px rgba(82,67,38,.15)}.topline{display:flex;justify-content:space-between;color:#6b6253;font:800 {{(15*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.title{margin:{{(22*s)|round|int}}px 0 {{(42*s)|round|int}}px;color:#2a302c;font:900 {{(56*s)|round|int}}px/.96 var(--kai-font-display);max-height:{{(155*s)|round|int}}px}.blocks{display:flex;align-items:center;gap:{{(12*s)|round|int}}px}.block{display:grid;place-items:center;flex:1;min-height:{{(160*s)|round|int}}px;padding:{{(20*s)|round|int}}px;border-radius:{{(18*s)|round|int}}px;background:#dfeef0;color:#1f4f59;text-align:center;font:800 {{(27*s)|round|int}}px/1.04 var(--kai-font-body)}.block:nth-child(2){background:#b7dbdf}.block:nth-child(3){background:#83c1c8}.block:nth-child(4){background:#4d95a1;color:white}.arrow{color:#d46d43;font:900 {{(30*s)|round|int}}px var(--kai-font-body)}.proof{margin-top:{{(28*s)|round|int}}px;color:#7b4c35;font:800 {{(19*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="model"><div class="topline"><span>{{brand_name}}</span><span>{{d.get('eyebrow','System map')}}</span></div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(26*s)|round|int}}">{{headline}}</h1><div class="blocks">{% for item in d.get('funnel_steps',['Attention','Interest','Decision','Action']) %}<div class="block">{{item}}</div>{% if not loop.last %}<span class="arrow">→</span>{% endif %}{% endfor %}</div><div class="proof" data-fit="interface-proof" data-min-font-size="{{(12*s)|round|int}}">{{proof_label or subhead}}</div></section></main></body></html>
