<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_portrait %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(68*s)|round|int}}px;background:#d8d3c5}.canvas::before,.canvas::after{display:none}.paper{height:100%;padding:{{(52*s)|round|int}}px;background:#fffdf6;box-shadow:0 {{(20*s)|round|int}}px {{(46*s)|round|int}}px rgba(52,42,24,.20)}.meta{display:flex;justify-content:space-between;color:#817867;font:800 {{(15*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.title{margin:{{(42*s)|round|int }}px 0;color:#29261f;font:900 {{(55*s)|round|int}}px/.98 var(--kai-font-display);max-height:{{(300*s)|round|int}}px}.line{height:{{(18*s)|round|int}}px;margin:{{(19*s)|round|int}}px 0;border-radius:999px;background:#e4e1d9}.line:nth-of-type(2){width:90%}.line:nth-of-type(3){width:70%}.mark{display:inline;padding:{{(2*s)|round|int}}px {{(6*s)|round|int}}px;background:linear-gradient(transparent 15%,#f6da46 15% 86%,transparent 86%);font-weight:800}.excerpt{margin-top:{{(45*s)|round|int}}px;color:#393328;font:700 {{(26*s)|round|int}}px/1.35 var(--kai-font-body)}.proof{margin-top:{{(36*s)|round|int}}px;color:#725d1c;font:800 {{(18*s)|round|int}}px/1.2 var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><article class="paper"><div class="meta"><span>{{brand_name}}</span><span>{{d.get('source_label','Highlighted excerpt')}}</span></div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(28*s)|round|int}}">{{headline}}</h1><div class="line"></div><div class="line"></div><div class="line"></div><p class="excerpt"><span class="mark">{{d.get('excerpt',subhead or 'The useful thing is usually the clearest thing.') }}</span></p><div class="proof" data-fit="interface-proof" data-min-font-size="{{(13*s)|round|int}}">{{proof_label}}</div></article></main></body></html>
