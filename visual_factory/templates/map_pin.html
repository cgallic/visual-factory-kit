<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_portrait %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(55*s)|round|int}}px;background:#cce5dd}.canvas::before,.canvas::after{display:none}.map{height:100%;overflow:hidden;border-radius:{{(30*s)|round|int}}px;background-color:#e8f2e7;background-image:linear-gradient(30deg,transparent 47%,#b5d0bd 48% 52%,transparent 53%),linear-gradient(120deg,transparent 47%,#c6d9c9 48% 52%,transparent 53%);background-size:{{(105*s)|round|int}}px {{(105*s)|round|int}}px;position:relative;box-shadow:0 {{(18*s)|round|int}}px {{(42*s)|round|int}}px rgba(29,86,62,.18)}.top{position:absolute;top:{{(40*s)|round|int}}px;left:{{(40*s)|round|int}}px;right:{{(40*s)|round|int}}px;padding:{{(18*s)|round|int}}px;border-radius:{{(15*s)|round|int}}px;background:#fff;color:#285445;font:800 {{(17*s)|round|int}}px var(--kai-font-body);box-shadow:0 {{(6*s)|round|int}}px {{(15*s)|round|int}}px rgba(29,86,62,.14)}.pin{position:absolute;top:43%;left:50%;display:grid;place-items:center;width:{{(115*s)|round|int}}px;height:{{(115*s)|round|int}}px;border-radius:50% 50% 50% 0;background:#de4b46;transform:translate(-50%,-50%) rotate(-45deg);box-shadow:{{(7*s)|round|int}}px {{(8*s)|round|int}}px 0 rgba(119,36,32,.22)}.pin:after{content:'●';color:white;font-size:{{(48*s)|round|int}}px;transform:rotate(45deg)}.caption{position:absolute;right:{{(38*s)|round|int}}px;bottom:{{(42*s)|round|int}}px;left:{{(38*s)|round|int}}px;padding:{{(24*s)|round|int}}px;border-radius:{{(17*s)|round|int}}px;background:#fff;color:#284b3d;font:900 {{(30*s)|round|int}}px/1.02 var(--kai-font-display);box-shadow:0 {{(8*s)|round|int}}px {{(18*s)|round|int}}px rgba(29,86,62,.14);max-height:{{(220*s)|round|int}}px}.proof{margin-top:{{(14*s)|round|int}}px;color:#5b836e;font:800 {{(14*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="map"><div class="top">{{d.get('location','A useful place to start')}}</div><div class="pin"></div><div class="caption" data-fit="interface-headline" data-min-font-size="{{(18*s)|round|int}}">{{headline}}<div class="proof" data-fit="interface-proof" data-min-font-size="{{(11*s)|round|int}}">{{proof_label or subhead}}</div></div></section></main></body></html>
