<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_square %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(58*s)|round|int}}px;background:#f7e5c9}.canvas::before,.canvas::after{display:none}.stack{height:100%;padding:{{(40*s)|round|int}}px;border-radius:{{(26*s)|round|int}}px;background:#fffaf0;color:#3f2c1f;box-shadow:0 {{(18*s)|round|int}}px {{(42*s)|round|int}}px rgba(104,60,20,.17)}.title{margin:0 0 {{(30*s)|round|int}}px;font:900 {{(49*s)|round|int}}px/.97 var(--kai-font-display);max-height:{{(210*s)|round|int}}px}.item{margin:{{(15*s)|round|int}}px 0;padding:{{(19*s)|round|int}}px {{(21*s)|round|int}}px;border-radius:{{(16*s)|round|int}}px;color:#fffdf6;background:#864c31;font:800 {{(23*s)|round|int}}px var(--kai-font-body);box-shadow:{{(6*s)|round|int}}px {{(7*s)|round|int}}px 0 #c7834b}.item:nth-child(3){background:#5f3853}.item:nth-child(4){background:#2c5c65}.item small{display:block;margin-top:{{(5*s)|round|int}}px;color:#f4d5b5;font:700 {{(13*s)|round|int}}px var(--kai-font-mono)}.proof{margin-top:{{(28*s)|round|int}}px;color:#8a5737;font:800 {{(15*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="stack"><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(23*s)|round|int}}">{{headline}}</h1>{% for item in d.get('offer_items',['Capture the useful signal','Choose the clear next step','Share a useful brief']) %}<div class="item">{{item}}<small>Included in the system</small></div>{% endfor %}<div class="proof" data-fit="interface-proof" data-min-font-size="{{(11*s)|round|int}}">{{proof_label or subhead}}</div></section></main></body></html>
