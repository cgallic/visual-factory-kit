<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_square %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(70*s)|round|int}}px;background:#c8d2c4}.canvas::before,.canvas::after{display:none}.photo{height:100%;padding:{{(30*s)|round|int}}px {{(30*s)|round|int}}px {{(53*s)|round|int}}px;transform:rotate(-3deg);background:#fff;box-shadow:0 {{(22*s)|round|int}}px {{(38*s)|round|int}}px rgba(40,54,43,.22)}.image{display:grid;place-items:center;height:58%;padding:{{(28*s)|round|int}}px;background:linear-gradient(135deg,#e2a77c,#916a80);color:#fff4df;text-align:center;font:900 {{(36*s)|round|int}}px/.98 var(--kai-font-display)}.caption{margin:{{(31*s)|round|int }}px 0 0;color:#38433b;font:800 {{(28*s)|round|int}}px/1.15 var(--kai-font-body)}.proof{margin-top:{{(21*s)|round|int}}px;color:#6e7e68;font:800 {{(14*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><article class="photo"><div class="image">{{d.get('photo_label','A moment that\nmade the next step clear')}}</div><div class="caption" data-fit="interface-headline" data-min-font-size="{{(17*s)|round|int}}">{{headline}}</div><div class="proof" data-fit="interface-proof" data-min-font-size="{{(11*s)|round|int}}">{{proof_label or subhead}}</div></article></main></body></html>
