<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_square %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(56*s)|round|int}}px;background:radial-gradient(circle at 75% 12%,#8ec7ed,transparent 30%),#13263c}.canvas::before,.canvas::after{display:none}.release{height:100%;padding:{{(43*s)|round|int}}px;border-radius:{{(27*s)|round|int}}px;background:linear-gradient(155deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);color:white}.top{display:flex;justify-content:space-between;align-items:center;color:#cde6f8;font:800 {{(15*s)|round|int}}px var(--kai-font-mono);text-transform:uppercase}.top img{width:{{(29*s)|round|int}}px;height:{{(29*s)|round|int}}px;object-fit:contain}.badge{display:inline-block;margin-top:{{(48*s)|round|int}}px;padding:{{(10*s)|round|int}}px {{(14*s)|round|int}}px;border-radius:999px;background:#7ee2c1;color:#164a43;font:900 {{(14*s)|round|int}}px var(--kai-font-mono)}.title{margin:{{(29*s)|round|int}}px 0;color:white;font:900 {{(54*s)|round|int}}px/.96 var(--kai-font-display);max-height:{{(260*s)|round|int}}px}.module{margin-top:{{(36*s)|round|int}}px;padding:{{(25*s)|round|int}}px;border-radius:{{(20*s)|round|int}}px;background:#e6f5ff;color:#1b3f5b}.module b{display:block;font:900 {{(31*s)|round|int}}px var(--kai-font-display)}.module span{display:block;margin-top:{{(9*s)|round|int}}px;font:700 {{(17*s)|round|int}}px/1.18 var(--kai-font-body)}.proof{margin-top:{{(22*s)|round|int}}px;color:#cde6f8;font:800 {{(14*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="release"><div class="top"><span>{{brand_name}}</span><img src="{{brand_icon_uri}}" alt=""></div><div class="badge">{{d.get('badge','NEW RELEASE')}}</div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(25*s)|round|int}}">{{headline}}</h1><div class="module"><b>{{d.get('module_title','A useful update')}}</b><span>{{subhead or 'A product capability that makes the next action clearer.' }}</span></div><div class="proof" data-fit="interface-proof" data-min-font-size="{{(10*s)|round|int}}">{{proof_label}}</div></section></main></body></html>
