<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_square %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(64*s)|round|int}}px;background:linear-gradient(145deg,#fff3d7,#f1d6ae)}.canvas::before,.canvas::after{display:none}.review{height:100%;padding:{{(45*s)|round|int}}px;border-radius:{{(28*s)|round|int}}px;background:#fffdf8;box-shadow:0 {{(20*s)|round|int}}px {{(42*s)|round|int}}px rgba(112,73,26,.16)}.top{display:flex;justify-content:space-between;align-items:center}.top img{width:{{(39*s)|round|int}}px;height:{{(39*s)|round|int}}px;object-fit:contain}.stars{color:#e89d13;font:900 {{(29*s)|round|int}}px var(--kai-font-mono)}.quote{margin:{{(47*s)|round|int}}px 0;color:#34251b;font:900 {{(47*s)|round|int}}px/1.02 var(--kai-font-display);max-height:{{(360*s)|round|int}}px}.author{padding-top:{{(26*s)|round|int}}px;border-top:1px solid #eadfcb;color:#826e58;font:800 {{(17*s)|round|int}}px var(--kai-font-body)}.proof{margin-top:{{(30*s)|round|int}}px;color:#8a5a19;font:800 {{(16*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><article class="review"><div class="top"><img src="{{brand_icon_uri}}" alt=""><span class="stars">★★★★★</span></div><div class="quote" data-fit="interface-headline" data-min-font-size="{{(25*s)|round|int}}">{{d.get('review',headline)}}</div><div class="author">{{d.get('reviewer','Approved customer review · Example Co.')}}</div><div class="proof" data-fit="interface-proof" data-min-font-size="{{(12*s)|round|int}}">{{proof_label or subhead}}</div></article></main></body></html>
