<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_portrait %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(58*s)|round|int}}px;background:#e7ebf1}.canvas::before,.canvas::after{display:none}.doc{height:100%;padding:{{(46*s)|round|int}}px;border-radius:{{(12*s)|round|int}}px;background:white;box-shadow:0 {{(18*s)|round|int}}px {{(42*s)|round|int}}px rgba(31,41,55,.16)}.bar{display:flex;justify-content:space-between;color:#8993a1;font:800 {{(15*s)|round|int}}px var(--kai-font-mono)}.title{margin:{{(38*s)|round|int}}px 0;color:#202938;font:900 {{(49*s)|round|int}}px/.98 var(--kai-font-display);max-height:{{(255*s)|round|int}}px}.old{margin-top:{{(34*s)|round|int}}px;padding:{{(18*s)|round|int}}px;color:#ac3947;background:#fff0f2;text-decoration:line-through;font:700 {{(23*s)|round|int}}px/1.25 var(--kai-font-body)}.new{margin-top:{{(18*s)|round|int}}px;padding:{{(18*s)|round|int}}px;color:#176c50;background:#eaf8f0;font:800 {{(24*s)|round|int}}px/1.25 var(--kai-font-body)}.note{margin-top:{{(35*s)|round|int}}px;padding:{{(17*s)|round|int}}px;border-left:{{(5*s)|round|int}}px solid #d44e54;color:#6a4a4e;background:#fff9ed;font:700 {{(18*s)|round|int}}px/1.2 var(--kai-font-body)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><article class="doc"><div class="bar"><span>{{brand_name}}</span><span>REVISION 01</span></div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(25*s)|round|int}}">{{headline}}</h1><div class="old">{{d.get('before_copy','A vague promise that makes the reader work too hard.') }}</div><div class="new">{{d.get('after_copy',subhead or 'A clear, specific next step that makes the value easy to see.') }}</div><div class="note" data-fit="interface-proof" data-min-font-size="{{(13*s)|round|int}}">{{proof_label}}</div></article></main></body></html>
