<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_square %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(55*s)|round|int}}px;background:#e6e2f1}.canvas::before,.canvas::after{display:none}.app{height:100%;overflow:hidden;border-radius:{{(24*s)|round|int}}px;background:#fff;box-shadow:0 {{(20*s)|round|int}}px {{(48*s)|round|int}}px rgba(50,36,80,.18)}.header{padding:{{(25*s)|round|int}}px {{(30*s)|round|int}}px;color:white;background:#452a57;font:800 {{(24*s)|round|int}}px var(--kai-font-body)}.header small{display:block;margin-top:{{(4*s)|round|int}}px;color:#cbbdda;font:700 {{(13*s)|round|int}}px var(--kai-font-mono)}.msg{display:flex;gap:{{(14*s)|round|int}}px;padding:{{(26*s)|round|int}}px {{(29*s)|round|int}}px;border-bottom:1px solid #eeeaf2}.avatar{width:{{(42*s)|round|int}}px;height:{{(42*s)|round|int}}px;border-radius:{{(8*s)|round|int}}px;background:#3d8fce;object-fit:contain}.name{color:#28212e;font:800 {{(18*s)|round|int}}px var(--kai-font-body)}.time{margin-left:{{(7*s)|round|int}}px;color:#8e8298;font:600 {{(12*s)|round|int}}px var(--kai-font-mono)}.copy{margin-top:{{(8*s)|round|int}}px;color:#423b49;font:600 {{(21*s)|round|int}}px/1.23 var(--kai-font-body)}.reaction{display:inline-block;margin-top:{{(13*s)|round|int}}px;padding:{{(7*s)|round|int}}px {{(11*s)|round|int}}px;border-radius:{{(9*s)|round|int}}px;background:#f2eefe;color:#50356c;font:700 {{(14*s)|round|int}}px var(--kai-font-body)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="app"><header class="header"># {{d.get('channel','wins-and-learnings')}}<small>{{d.get('subchannel','A small update worth sharing')}}</small></header><article class="msg"><img class="avatar" src="{{brand_icon_uri}}" alt=""><div><div class="name">{{brand_name}} <span class="time">{{d.get('time','9:41 AM')}}</span></div><div class="copy" data-fit="interface-headline" data-min-font-size="{{(15*s)|round|int}}">{{headline}}</div><div class="reaction">✦ {{proof_label or 'useful'}}</div></div></article><article class="msg"><img class="avatar" src="{{brand_icon_uri}}" alt=""><div><div class="name">Team</div><div class="copy" data-fit="interface-proof" data-min-font-size="{{(13*s)|round|int}}">{{subhead}}</div></div></article></section></main></body></html>
