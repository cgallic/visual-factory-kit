<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{ headline }}</title><style>
{{ font_css | safe }}
{{ tokens_css | safe }}
{{ shared_css | safe }}

{% set s=scale_landscape %}{% set d=template_data %}:root{--canvas-width:{{width}}px;--canvas-height:{{height}}px}.canvas{padding:{{(42*s)|round|int}}px;background:#0a1219}.canvas::before,.canvas::after{display:none}.terminal{height:100%;padding:{{(31*s)|round|int}}px;border:1px solid #2d4b5b;border-radius:{{(18*s)|round|int}}px;background:#0e1b25;color:#d9f7ea;box-shadow:0 {{(18*s)|round|int}}px {{(40*s)|round|int}}px rgba(0,0,0,.34)}.bar{display:flex;align-items:center;gap:{{(10*s)|round|int}}px;color:#7f9caf;font:700 {{(15*s)|round|int}}px var(--kai-font-mono)}.dot{width:{{(12*s)|round|int}}px;height:{{(12*s)|round|int}}px;border-radius:50%;background:#f06d6d}.dot:nth-child(2){background:#f1c75b}.dot:nth-child(3){background:#6bcf96}.line{margin-top:{{(22*s)|round|int}}px;color:#83e4b5;font:700 {{(19*s)|round|int}}px var(--kai-font-mono)}.line span{color:#77bde6}.title{margin:{{(32*s)|round|int}}px 0;color:#ecfff7;font:900 {{(49*s)|round|int}}px/.98 var(--kai-font-display);max-height:{{(140*s)|round|int}}px}.output{padding:{{(19*s)|round|int}}px;border-left:{{(4*s)|round|int}}px solid #3d9fcf;background:#112735;color:#bfdae8;font:700 {{(20*s)|round|int}}px/1.3 var(--kai-font-mono)}.proof{margin-top:{{(22*s)|round|int}}px;color:#f2ce80;font:800 {{(16*s)|round|int}}px var(--kai-font-mono)}
</style></head><body><main class="canvas" role="img" aria-label="{{alt_text}}"><section class="terminal"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>operator@{{brand_name|lower}}:~</span></div><div class="line"><span>$</span> {{d.get('command','inspect --next-step')}}</div><h1 class="title" data-fit="interface-headline" data-min-font-size="{{(23*s)|round|int}}">{{headline}}</h1><div class="output">✓ {{subhead or 'Useful context captured. The right next action is ready.'}}</div><div class="proof" data-fit="interface-proof" data-min-font-size="{{(11*s)|round|int}}">{{proof_label}}</div></section></main></body></html>
